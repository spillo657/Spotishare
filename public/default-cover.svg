<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121218" />
      <stop offset="50%" stop-color="#181824" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1DB954" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="spotifyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#1DB954" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="160" fill="url(#glowGrad)" />

  <!-- Outer Vinyl Rim -->
  <circle cx="200" cy="200" r="140" fill="#18181f" stroke="#282834" stroke-width="3" />
  <circle cx="200" cy="200" r="120" fill="none" stroke="#22222e" stroke-width="1.5" stroke-dasharray="8, 6" />
  <circle cx="200" cy="200" r="100" fill="none" stroke="#22222e" stroke-width="1.5" />
  <circle cx="200" cy="200" r="80" fill="none" stroke="#2a2a38" stroke-width="1.5" stroke-dasharray="4, 4" />

  <!-- Center Disc -->
  <circle cx="200" cy="200" r="60" fill="url(#spotifyGrad)" filter="drop-shadow(0 0 20px rgba(29,185,84,0.4))" />

  <!-- Center Spindle -->
  <circle cx="200" cy="200" r="16" fill="#0b0b0f" stroke="#1DB954" stroke-width="3" />

  <!-- Spotify Icon Wave mark -->
  <path d="M178 185 c 14 -3, 30 0, 44 8" stroke="#0b0b0f" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M182 198 c 11 -2, 24 1, 35 7" stroke="#0b0b0f" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M187 210 c 8 -1, 17 0, 25 5" stroke="#0b0b0f" stroke-width="2.8" stroke-linecap="round" fill="none"/>
</svg>
